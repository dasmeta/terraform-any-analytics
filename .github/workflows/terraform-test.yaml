name: Terraform Test

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  terraform-validate-modules:
    name: Terraform module validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path:
          - modules/airbyte
          - modules/dbt
          - modules/postgrest
          - modules/metabase
          - modules/redash
          - .
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Initialize Terraform
        working-directory: ${{ matrix.path }}/tests/basic
        run: terraform init -backend=false

      - name: Validate Terraform
        working-directory: ${{ matrix.path }}/tests/basic
        run: terraform validate

  # Temporary compatibility adapter for the centrally managed branch-protection
  # contexts. Remove this when DMVP-10370 publishes the corrected workflow
  # generator and this repository returns to generated CI.
  terraform-validate:
    name: terraform-validate
    if: ${{ always() }}
    needs: terraform-validate-modules
    runs-on: ubuntu-latest
    steps:
      - name: Require every module validation to pass
        env:
          VALIDATION_RESULT: ${{ needs.terraform-validate-modules.result }}
        run: |
          test "$VALIDATION_RESULT" = "success"

  terraform-validate-root:
    name: terraform-validate (/)
    if: ${{ always() }}
    needs: terraform-validate-modules
    runs-on: ubuntu-latest
    steps:
      - name: Require every module validation to pass
        env:
          VALIDATION_RESULT: ${{ needs.terraform-validate-modules.result }}
        run: |
          test "$VALIDATION_RESULT" = "success"
