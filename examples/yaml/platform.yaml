# Copy into a customer IaC repository and replace the version with a release.
# The caller provisions namespace, databases, grants, storage, Redis, and
# Secrets separately, then passes their non-secret references here.
source: dasmeta/analytics/any//modules/platform
version: "<released-platform-version>"
variables:
  namespace: example-analytics
  airbyte:
    database:
      host: postgresql.example.internal
      name: airbyte
      secret_name: airbyte-database
    storage:
      bucket: example-airbyte
      region: example-region-1
      secret_name: airbyte-storage
  dbt:
    image:
      repository: registry.example.com/data-products/example-dbt
      tag: "1.0.0"
    command:
      - dbt
      - build
      - --target
      - production
    schedule: "0 2 * * *"
    configuration_secret_name: example-dbt-configuration
    configuration_secret_keys:
      - DBT_TARGET
      - DBT_USER
      - DBT_PASSWORD
  postgrest:
    configuration_secret_name: postgrest-configuration
  visualization:
    # provider defaults to metabase when omitted.
    metabase:
      application_database_secret_name: metabase-application-database
